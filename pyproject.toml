[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abm-engine"
version = "0.1.0"
description = "Evidence-first ABM research starter kit with 866 buying-signal definitions."
requires-python = ">=3.9"
authors = [{ name = "Reshma Baskaran" }]
dependencies = []

[project.scripts]
abm-engine = "abm_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
